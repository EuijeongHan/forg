services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: forg
      POSTGRES_PASSWORD: forg1234
      POSTGRES_DB: forg
    ports:
      # 루프백 한정 — 개발용 비밀번호가 공개 리포에 있으므로, 공유 네트워크(카페
      # 와이파이 등)에서 compose를 켰을 때 외부에서 접속 가능한 DB가 열리면 안 된다.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forg -d forg"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      # 로컬 개발용 — /health는 개발자만 보면 되고, 봇은 아웃바운드만 쓴다
      - "127.0.0.1:8000:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app

volumes:
  postgres_data:
